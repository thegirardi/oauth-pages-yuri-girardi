<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laboratório OAuth</title>
</head>

<body>
  <h1>Laboratório OAuth</h1>

  <p id="status">Verificando sessão...</p>

  <h2>Login</h2>

  <p>
    <a href="/oauth/login/google">
      Entrar com Google
    </a>
  </p>

  <p>
    <a href="/oauth/login/github">
      Entrar com GitHub
    </a>
  </p>

  <form method="post" action="/oauth/logout">
    <button type="submit">
      Sair
    </button>
  </form>

  <script>
    fetch("/api/me", {
      credentials: "same-origin"
    })
      .then((response) => {
        if (!response.ok) {
          return null;
        }

        return response.json();
      })
      .then((user) => {
        const status =
          document.getElementById("status");

        status.textContent = user
          ? `Sessão de ${user.email ?? user.displayName}.`
          : "Nenhuma sessão neste navegador.";
      })
      .catch(() => {
        document.getElementById("status").textContent =
          "Nenhuma sessão neste navegador.";
      });
  </script>
</body>
</html>
